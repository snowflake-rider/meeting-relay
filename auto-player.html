<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whale Relay</title>
<style>body{margin:0;background:#10151d;color:#ecf3ff;font:14px system-ui}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px}h1{font-size:17px;margin:0}#status{flex:1;min-width:160px;color:#adc9ec}button{padding:8px 12px;border:1px solid #526a87;border-radius:7px;background:#22344b;color:inherit;cursor:pointer}video{display:block;width:100%;height:calc(100vh - 120px);object-fit:contain;background:#05080c}footer{padding:12px;color:#9bafca;font-size:12px}</style>
<header><h1>Whale Relay</h1><span id="status">웨일 회의 연결 대기</span><button id="sound">소리 켜기</button><button id="full">전체 화면</button><button id="stop">중계 끊기</button></header>
<video autoplay muted playsinline controls></video><footer>웨일 회의 창을 켜두세요. 영상은 이 컴퓨터 안에서 전달됩니다. 소리는 기본적으로 꺼져 있습니다.</footer><script src="/player.js"></script><style id="relay-ui-style">html,body{margin:0!important;width:100%;height:100%;overflow:hidden;background:#05070a;color:#edf4ff;font:14px system-ui}header,footer{display:none!important}#relay-stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}#relay-stage:active{cursor:grabbing}#relay-stage video{display:block!important;width:100%!important;height:100%!important;object-fit:contain;background:transparent;transform-origin:center;max-width:none;user-select:none;pointer-events:none}#relay-tools{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:5px;padding:7px;border:1px solid #ffffff24;border-radius:14px;background:#142032d9;backdrop-filter:blur(14px);box-shadow:0 6px 24px #0005;opacity:.55;transition:opacity .18s}#relay-tools:hover,#relay-tools:focus-within{opacity:1}#relay-tools button{box-sizing:border-box;width:38px;height:36px;margin:0;padding:0;border:0;border-radius:7px;background:transparent;color:#edf4ff;cursor:pointer;font:18px system-ui;display:grid;place-items:center}#relay-tools button:hover{background:#ffffff20}#relay-tools button:focus-visible{outline:2px solid #a4d0ff;outline-offset:1px}#relay-tools #full,#relay-tools #stop{font-size:0}#relay-tools #full::before{content:'⛶';font-size:24px}#relay-tools #stop::before{content:'⏹';font-size:19px}#relay-tools #zoom-reset{font-size:10px;font-weight:600}#relay-tools hr{width:24px;margin:2px auto;border:0;border-top:1px solid #ffffff25}#relay-status{position:fixed;left:12px;bottom:12px;z-index:30;max-width:calc(100% - 90px);padding:7px 11px;border-radius:8px;background:#142032da;color:#e1ebfa;font:12px system-ui;pointer-events:none;opacity:0;transition:opacity .2s}#relay-status.show{opacity:1}#status{position:absolute!important;width:1px!important;height:1px!important;clip-path:inset(50%);overflow:hidden}video::-webkit-media-controls{display:none!important}@media(max-height:430px){#relay-tools{gap:1px;padding:4px;right:7px}#relay-tools button{height:28px;width:32px}}@media(prefers-reduced-motion:reduce){#relay-tools,#relay-status{transition:none}}

#relay-tools #record{color:#ff777b}#relay-tools #record.recording{background:#812d3c;color:#fff}#recording-time{font:9px ui-monospace,monospace;text-align:center;color:#ffb1b5}#recording-time:empty{display:none}#recording-download:not([hidden]){display:grid;place-items:center;height:30px;color:#7de5cf;text-decoration:none;font-size:22px}#relay-tools{max-height:calc(100vh - 24px);overflow-y:auto}

#relay-tools{padding:9px 7px;border-color:#93b9d633;background:linear-gradient(155deg,#1a2a3aeb,#101b2beb);opacity:.88;box-shadow:0 8px 30px #0006}#relay-tools svg{display:block;width:22px;height:22px}#relay-tools button[aria-pressed="true"]:not(#record){background:#8ebfff16;color:#d5eeff}#relay-connection{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0 10px;margin-bottom:2px;border-bottom:1px solid #ffffff20;font:8px/1.2 system-ui;letter-spacing:1px;color:#ffaaaa}#relay-connection .connection-dot{width:8px;height:8px;border-radius:50%;background:#ff626c;box-shadow:0 0 0 3px #ff626c18}#relay-connection[data-connected="true"]{color:#86efc4}#relay-connection[data-connected="true"] .connection-dot{background:#3cdb9b;box-shadow:0 0 0 3px #3cdb9b18}
</style><script>/* Sequential, acknowledged upload. Retrying the same sequence never duplicates bytes. */
async function createDiskUpload(mime) {
  async function request(path, body, token, raw = false) {
    const response = await fetch(path, {method:body === undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':raw?'application/octet-stream':'application/json','X-Recording-Token':token},body:body===undefined?undefined:raw?body:JSON.stringify(body),signal:AbortSignal.timeout(15000),keepalive:path.endsWith('/abort')});
    const data = await response.json();
    if (!response.ok) throw Error(data.error || '녹화 저장 서버 오류');
    return data;
  }
  const settings=await request('/recording/settings');
  const job=await request('/recording/start',{mime},settings.token);
  let sequence=0;
  return {
    job,
    async append(blob){
      for(let offset=0;offset<blob.size;offset+=4*1024*1024){
        const chunk=blob.slice(offset,offset+4*1024*1024);
        for(let attempt=0;;attempt++){
          try{await request(`/recording/${job.id}/chunk?seq=${sequence}`,chunk,settings.token,true);break;}
          catch(error){if(attempt===2)throw error;await new Promise(r=>setTimeout(r,400*(attempt+1)));}
        }
        sequence++;
      }
    },
    heartbeat:()=>request(`/recording/${job.id}/heartbeat`,{},settings.token),
    finish:()=>request(`/recording/${job.id}/finish`,{chunks:sequence},settings.token),
    abort:()=>request(`/recording/${job.id}/abort`,{},settings.token),
    status:()=>request(`/recording/${job.id}/status`)
  };
}

/* Records received tracks, not the zoomed viewport. Never stops meeting tracks. */
function createRelayRecorder(video, getAudios, callbacks) {
  let active = null;
  const tracks = () => [...new Set([
    ...(video.srcObject?.getVideoTracks() || []),
    ...(video.srcObject?.getAudioTracks() || []),
    ...getAudios().flatMap(a => a.srcObject?.getAudioTracks() || [])
  ])].filter(t => t.readyState === 'live');
  const update = state => callbacks.onState(state);
  function cleanup(s) {
    clearInterval(s.timer);
    clearInterval(s.heartbeatTimer);
    s.clones.forEach(t => t.stop());
    s.nodes.forEach(n => n.disconnect());
    s.context?.close().catch(() => {});
    if (active === s) active = null;
  }
  function stop(reason = '') {
    const s = active;
    if (!s || s.stopping) return;
    s.stopping = true;
    s.reason = reason;
    update({status: 'saving'});
    if (s.recorder?.state !== 'inactive' && s.recorder) s.recorder.stop();
    // If audio setup is pending, start() finishes cleanup after it resumes.
  }
  async function start() {
    if (active) return;
    if (typeof MediaRecorder === 'undefined') throw new Error('이 브라우저는 녹화를 지원하지 않습니다. Chrome을 사용하세요.');
    const originals = tracks();
    if (!originals.some(t => t.kind === 'video')) throw new Error('영상이 연결된 뒤 녹화를 시작하세요.');
    const s = {originals, clones: [], nodes: [], queue: Promise.resolve(), pending: 0, bytes: 0, stopping: false};
    active = s;
    update({status: 'starting'});
    try {
      const stream = new MediaStream();
      const v = originals.find(t => t.kind === 'video').clone();
      s.clones.push(v); stream.addTrack(v);
      const audio = originals.filter(t => t.kind === 'audio');
      if (audio.length) {
        const AudioEngine = globalThis.AudioContext || globalThis.webkitAudioContext;
        if (!AudioEngine) throw new Error('오디오 녹화를 지원하지 않는 브라우저입니다.');
        s.context = new AudioEngine();
        const destination = s.context.createMediaStreamDestination();
        for (const original of audio) {
          const clone = original.clone(); s.clones.push(clone);
          const node = s.context.createMediaStreamSource(new MediaStream([clone]));
          node.connect(destination); s.nodes.push(node);
        }
        const mixed = destination.stream.getAudioTracks()[0];
        s.clones.push(mixed); stream.addTrack(mixed);
        await s.context.resume();
        if (s.context.state !== 'running') throw new Error('오디오 녹화를 시작하지 못했습니다. 다시 시도하세요.');
      }
      if (s.stopping) { cleanup(s); update({status: 'idle'}); return; }
      const types = audio.length ? ['video/webm;codecs=vp8,opus', 'video/webm'] : ['video/webm;codecs=vp8', 'video/webm'];
      const mimeType = types.find(type => MediaRecorder.isTypeSupported(type));
      if (!mimeType) throw new Error('지원되는 녹화 형식이 없습니다. Chrome을 사용하세요.');
      s.upload = await createDiskUpload(mimeType);
      if (s.stopping) { await s.upload.abort(); cleanup(s); update({status:'idle'}); return; }
      // Keep the lease alive even when a static or suspended source emits no chunks.
      s.heartbeatTimer = setInterval(async()=>{
        if (s.heartbeatPending || s.uploadError) return;
        s.heartbeatPending = true;
        try { await s.upload.heartbeat(); }
        catch(error) { /* Chunk/finalization requests surface sustained failures. */ }
        finally { s.heartbeatPending = false; }
      }, 20000);
      s.recorder = new MediaRecorder(stream, {mimeType, videoBitsPerSecond: 5000000});
      s.recorder.ondataavailable = event => {
        if (!event.data.size || s.uploadError) return;
        s.pending += event.data.size; s.bytes += event.data.size;
        s.queue = s.queue.then(async()=>{
          if(s.uploadError)return;
          try{await s.upload.append(event.data);}
          catch(error){s.uploadError=error;stop('디스크 저장이 중단되었습니다.');}
          finally{s.pending-=event.data.size;}
        });
        if(s.pending>32*1024*1024)stop('디스크 저장 지연으로 녹화를 중지하고 남은 데이터를 저장합니다.');
      };
      s.recorder.onerror = event => { s.reason = '녹화 오류: ' + (event.error?.message || '브라우저 오류'); stop(s.reason); };
      s.recorder.onstop = async () => {
        clearInterval(s.timer);
        update({status:'saving'});
        let finalized=false;
        try{
          await s.queue;
          if(s.uploadError)throw s.uploadError;
          const job=await s.upload.finish();
          cleanup(s);update({status:'idle'});finalized=true;
          callbacks.onFile({...job,webm:true},s.reason);
          if(job.state==='converting'){
            let state=job;
            while(state.state==='converting'){
              await new Promise(r=>setTimeout(r,2000));state=await s.upload.status();
            }
            callbacks.onFile(state,s.reason,true);
          }
        }catch(error){
          if(finalized){callbacks.onError('변환 상태를 확인하지 못했습니다. ⚙에서 파일을 확인하세요.');return;}
          await s.upload.abort().catch(()=>{});cleanup(s);update({status:'idle'});
          callbacks.onError(error.message+' · 녹화 설정의 파일 목록에서 저장된 데이터를 확인하세요.');
        }
      };
      s.recorder.start(1000);
      s.started = Date.now();
      update({status: 'recording', seconds: 0, audio: Boolean(audio.length)});
      s.timer = setInterval(() => {
        if (s.stopping) return;
        const current = tracks();
        if (current.length !== originals.length || current.some(t => !originals.includes(t))) {
          stop('영상·오디오 연결이 바뀌어 녹화를 저장했습니다. 다시 연결되면 새 녹화를 시작하세요.');
          return;
        }
        update({status: 'recording', seconds: Math.floor((Date.now() - s.started) / 1000), bytes:s.bytes, audio: Boolean(audio.length)});
      }, 500);
    } catch (error) { if(s.upload)await s.upload.abort().catch(()=>{}); cleanup(s); update({status: 'idle'}); throw error; }
  }
  globalThis.addEventListener?.('pagehide',()=>{active?.upload?.abort().catch(()=>{});});
  return {start, stop, get active() { return Boolean(active); }};
}

function installRelayUI(video, getAudios, getRelayState = () => ({connected:false, sound:false})) {
  if (document.querySelector('#relay-tools')) return;
  video.removeAttribute('controls');
  const stage=document.createElement('div');stage.id='relay-stage';
  video.parentNode.insertBefore(stage,video);stage.append(video);
  const tools=document.createElement('aside');tools.id='relay-tools';tools.setAttribute('aria-label','영상 도구');
  const toast=document.createElement('div');toast.id='relay-status';toast.setAttribute('role','status');
  document.body.append(tools,toast);
  let toastTimer,scale=1,x=0,y=0;
  function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200);}
  function add(id,text,label,action){const b=document.createElement('button');b.id=id;b.textContent=text;b.title=label;b.setAttribute('aria-label',label);b.onclick=action;tools.append(b);return b;}
  const connection=document.createElement('div');connection.id='relay-connection';connection.setAttribute('role','status');connection.setAttribute('aria-live','polite');tools.append(connection);
  const icon=paths=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
  const speaker='<path d="M11 5 6 9H3v6h3l5 4V5Z"/>';
  const speakerOn=icon(speaker+'<path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/>');
  const speakerOff=icon(speaker+'<path d="m3 3 18 18"/>');
  const play=add('toggle-play','Ⅱ','일시정지 (Space)',()=>{if(video.paused)video.play().catch(()=>notify('재생할 영상이 없습니다'));else video.pause();});
  const plus=add('zoom-in','+','확대 (+)',()=>zoom(scale*1.25));
  const reset=add('zoom-reset','100%','화면 맞춤 (0)',()=>{scale=1;x=0;y=0;render();});
  add('zoom-out','−','축소 (-)',()=>zoom(scale/1.25));
  tools.append(document.createElement('hr'));
  const snapshot=add('snapshot','','스크린샷 저장 (S)',()=>{
    if(!video.videoWidth||video.readyState<2){notify('영상이 들어온 뒤 캡처할 수 있습니다');return;}
    const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;
    try{c.getContext('2d').drawImage(video,0,0);c.toBlob(blob=>{if(!blob){notify('스크린샷을 만들지 못했습니다');return;}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='whale-'+new Date().toISOString().replace(/[:.]/g,'-')+'.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);notify('원본 해상도 PNG 저장');},'image/png');}catch(e){notify('캡처 실패: '+e.message);}
  });
  snapshot.innerHTML=icon('<path d="M9 4 7 7H4a2 2 0 0 0-2 2v10h20V9a2 2 0 0 0-2-2h-3l-2-3H9Z"/><circle cx="12" cy="13" r="4"/>');
  let lastRecordingId;
  add('recording-settings','⚙','녹화 설정 · MP4 변환',()=>window.open('/recording-settings','_blank','noopener'));
  const record = add('record','●','녹화 시작/중지 (R)',()=>{
    if(recorder.active) recorder.stop();
    else recorder.start().catch(e=>notify(e.message));
  });
  record.setAttribute('aria-pressed','false');
  const recordingLabel=document.createElement('span');recordingLabel.id='recording-time';tools.append(recordingLabel);
  const download=document.createElement('a');download.id='recording-download';download.textContent='↓';download.title='마지막 녹화 다시 저장';download.setAttribute('aria-label',download.title);download.hidden=true;tools.append(download);
  const recorder=createRelayRecorder(video,getAudios,{
    onState(state){
      const busy=state.status==='starting'||state.status==='saving';
      record.disabled=busy;record.classList.toggle('recording',state.status==='recording');record.setAttribute('aria-pressed',String(state.status==='recording'));
      record.textContent=state.status==='recording'?'■':'●';
      recordingLabel.textContent=state.status==='recording'?Math.floor(state.seconds/60)+':'+String(state.seconds%60).padStart(2,'0'):busy?'…':'';
      if(state.status==='recording'&&state.seconds===0)notify(state.audio?'녹화 시작 · 재생 음소거와 무관하게 오디오 포함':'녹화 시작 · 현재 오디오 트랙 없음');
    },
    onFile(job,reason,conversionUpdate=false){
      if(conversionUpdate&&job.id!==lastRecordingId)return;
      lastRecordingId=job.id;
      const format=job.mp4?'mp4':'webm';
      download.href=`/recording/${job.id}/file?format=${format}`;download.download='meeting-'+job.id+'.'+format;download.hidden=false;
      if(job.state==='converting')notify('WebM 저장 완료 · MP4 변환 중. ⚙에서 상태를 확인하세요.');
      else if(job.state==='conversion_failed')notify('MP4 변환 실패 · WebM 보존. ⚙에서 재시도하세요.');
      else {download.click();notify(reason||'녹화 파일 저장 완료 · ↓로 다운로드');}
    },
    onError:notify
  });
  addEventListener('beforeunload',e=>{if(recorder.active){e.preventDefault();e.returnValue='';}});
  for(const [id,title] of [['sound','소리 켜기/끄기'],['full','전체 화면 (F)'],['stop','중계 끊기/다시 연결']]){const b=document.getElementById(id);if(b){b.title=title;b.setAttribute('aria-label',title);tools.append(b);}}
  const soundButton=document.querySelector('#sound');
  let previousConnected,previousSound;
  function syncIndicators(){
    const state=getRelayState();
    const connected=Boolean(state.connected&&video.srcObject?.getVideoTracks().some(t=>t.readyState==='live'&&!t.muted));
    if(connected!==previousConnected){
      previousConnected=connected;connection.dataset.connected=String(connected);
      connection.innerHTML='<span class="connection-dot" aria-hidden="true"></span><span>'+(connected?'LIVE':'OFF')+'</span>';
      connection.title=connected?'영상 연결됨':'영상 연결 끊김 / 연결 대기';connection.setAttribute('aria-label',connection.title);
    }
    const enabled=Boolean(state.sound);
    // Receiver click handlers may replace button text; restore the icon immediately.
    if(soundButton&&(enabled!==previousSound||!soundButton.querySelector('svg'))){
      previousSound=enabled;soundButton.innerHTML=enabled?speakerOn:speakerOff;
      soundButton.title=enabled?'소리 켜짐 · 눌러서 끄기':'소리 꺼짐 · 눌러서 켜기';
      soundButton.setAttribute('aria-label',soundButton.title);soundButton.setAttribute('aria-pressed',String(enabled));
    }
  }
  soundButton?.addEventListener('click',()=>{if(video.paused)getAudios().forEach(a=>a.pause());syncIndicators();});
  syncIndicators();
  const indicatorTimer=setInterval(syncIndicators,500);
  addEventListener('pagehide',()=>clearInterval(indicatorTimer),{once:true});
  const full=document.querySelector('#full');if(full)full.onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>notify('전체 화면을 사용할 수 없습니다'));else video.webkitEnterFullscreen?.();};
  function bounds(){const w=stage.clientWidth,h=stage.clientHeight;const fit=video.videoWidth?Math.min(w/video.videoWidth,h/video.videoHeight):1;return{mx:Math.max(0,video.videoWidth*fit*scale-w)/2,my:Math.max(0,video.videoHeight*fit*scale-h)/2};}
  function render(){const b=bounds();x=Math.max(-b.mx,Math.min(b.mx,x));y=Math.max(-b.my,Math.min(b.my,y));video.style.transform=`translate(${x}px,${y}px) scale(${scale})`;reset.textContent=Math.round(scale*100)+'%';reset.setAttribute('aria-label',`확대 ${Math.round(scale*100)}%, 눌러서 화면 맞춤`);plus.disabled=scale>=8;}
  function zoom(next,cx=stage.clientWidth/2,cy=stage.clientHeight/2){next=Math.max(1,Math.min(8,next));const ratio=next/scale;x=(cx-stage.clientWidth/2)*(1-ratio)+x*ratio;y=(cy-stage.clientHeight/2)*(1-ratio)+y*ratio;scale=next;render();}
  stage.addEventListener('wheel',e=>{e.preventDefault();zoom(scale*Math.exp(-e.deltaY*(e.ctrlKey ? .012 : .002)),e.clientX,e.clientY);},{passive:false});
  const points=new Map();let previous=null;
  const gesture=()=>{const ps=[...points.values()];return ps.length>1?{cx:(ps[0].x+ps[1].x)/2,cy:(ps[0].y+ps[1].y)/2,d:Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y)}:ps.length?{cx:ps[0].x,cy:ps[0].y,d:0}:null;};
  stage.onpointerdown=e=>{points.set(e.pointerId,{x:e.clientX,y:e.clientY});stage.setPointerCapture(e.pointerId);previous=gesture();};
  stage.onpointermove=e=>{if(!points.has(e.pointerId))return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});const g=gesture();if(previous){if(g.d&&previous.d)zoom(scale*g.d/previous.d,g.cx,g.cy);else{x+=g.cx-previous.cx;y+=g.cy-previous.cy;render();}}previous=g;};
  stage.onpointerup=stage.onpointercancel=e=>{points.delete(e.pointerId);previous=gesture();};
  let gestureScale=1;
  stage.addEventListener('gesturestart',e=>{e.preventDefault();gestureScale=scale;},{passive:false});
  stage.addEventListener('gesturechange',e=>{e.preventDefault();zoom(gestureScale*e.scale,e.clientX||stage.clientWidth/2,e.clientY||stage.clientHeight/2);},{passive:false});
  stage.ondblclick=()=>{scale=1;x=y=0;render();};
  const sync=()=>{play.textContent=video.paused?'▶':'Ⅱ';play.title=video.paused?'재생 (Space)':'일시정지 (Space)';play.setAttribute('aria-label',play.title);getAudios().forEach(a=>{if(video.paused)a.pause();else a.play().catch(()=>{});});};
  video.addEventListener('pause',sync);video.addEventListener('play',sync);video.addEventListener('resize',render);addEventListener('resize',render);
  const status=document.getElementById('status');if(status)new MutationObserver(()=>{if(!status.textContent.startsWith('영상 재생'))notify(status.textContent);}).observe(status,{childList:true,subtree:true,characterData:true});
  document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName))return;const k=e.key.toLowerCase();if(k===' '){e.preventDefault();play.click();}else if(k==='+'||k==='=')zoom(scale*1.25);else if(k==='-')zoom(scale/1.25);else if(k==='0')reset.click();else if(k==='s')document.querySelector('#snapshot').click();else if(k==='f')full?.click();else if(k==='r')record.click();});
  sync();render();notify('휠·핀치로 확대 · 드래그로 이동 · 0으로 화면 맞춤');
}

installRelayUI(video,()=>audios,()=>({connected:pc?.connectionState==="connected",sound}));</script></html>
